{% extends "base.html" %}
{% block title %}Edit item - Give &amp; Take{% endblock %}
{% block content %}
<h1>Edit item</h1>
<p class="muted"><a href="/admin">Back to admin</a></p>
<form method="post" action="/admin/items/{{ item.id }}/edit" enctype="multipart/form-data">
  <div class="form-row"><label>Title</label><input name="title" value="{{ item.title }}" required></div>
  <div class="form-row"><label>Description</label><textarea name="description">{{ item.description or '' }}</textarea></div>
  <div class="form-row"><label>Price (0 = free)</label><input type="number" step="0.01" name="price" value="{{ item.price }}"></div>
  <div class="form-row"><label>Condition</label><input name="condition" value="{{ item.condition or '' }}" placeholder="New / Used / Good"></div>
  <div class="form-row"><label>Category</label><input name="category" value="{{ item.category or '' }}" placeholder="Furniture, Electronics..."></div>
  <div class="form-row"><label>Status</label>
    <select name="status_val">
      {% for s in ['available','claimed','sold'] %}
      <option value="{{ s }}" {% if item.status==s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  {% if item.image %}<div class="form-row"><label>Current image</label><br><img src="{{ item.image }}" style="max-width:200px;border-radius:8px;"></div>{% endif %}
  <div class="form-row"><label>Image URL (leave blank to keep current)</label><input name="image_url" placeholder="https://..."></div>
  <div class="form-row"><label>Or upload new image</label><input type="file" name="image" accept="image/*"></div>
  <button class="btn" type="submit">Save changes</button>
</form>
{% endblock %}
